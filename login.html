<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Infinity Blog</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-badge">∞</span>
        <span>Infinity Blog</span>
      </a>
      <nav>
        <ul class="nav-menu"></ul>
      </nav>
      <div class="header-actions"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-wrapper">
    <div class="login-page-wrapper">
      <div class="login-card">
        <div class="login-header">
          <span class="badge badge-category" style="margin-bottom: var(--space-2);">Author &amp; Admin Portal</span>
          <h1 class="login-title">Sign in to your account</h1>
          <p style="color:var(--color-text-muted);font-size:0.9rem;">Enter your credentials to access the management dashboard.</p>
        </div>

        <!-- Error Feedback Banner -->
        <div id="login-error-alert" class="alert alert-danger" style="display:none;"></div>

        <!-- Success Feedback Banner -->
        <div id="login-success-alert" class="alert alert-success" style="display:none;"></div>

        <!-- Login Form -->
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="identifier" class="form-label">Username or Email</label>
            <input type="text" id="identifier" name="identifier" class="form-control" placeholder="e.g. Sounak Sikdar or author@example.com" required autofocus>
            <div class="form-error" id="identifier-error"></div>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="password-input-group">
              <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
              <button type="button" class="password-toggle-btn" id="toggle-password-btn" aria-label="Toggle password visibility">Show</button>
            </div>
            <div class="form-error" id="password-error"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" id="login-submit-btn" style="width:100%;margin-top:var(--space-4);">
            <span id="btn-text">Sign In</span>
            <span id="btn-spinner" class="spinner" style="display:none;width:1.2rem;height:1.2rem;border-width:2px;border-top-color:#ffffff;"></span>
          </button>
        </form>

        <div style="margin-top:var(--space-6);padding-top:var(--space-4);border-top:1px solid var(--color-border);text-align:center;">
          <a href="index.html" style="color:var(--color-text-muted);font-size:0.875rem;text-decoration:none;">&larr; Back to Public Blog</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; 2026 Infinity Blog. Session-based PHP Security.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="assets/js/main.js"></script>
  <script type="module">
    import { authService } from './assets/js/auth.js';
    import { showToast } from './assets/js/main.js';

    // If already authenticated, redirect to appropriate destination
    authService.getCurrentUser().then(user => {
      if (user) {
        window.location.href = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
      }
    });

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('login-submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const errorAlert = document.getElementById('login-error-alert');
    const successAlert = document.getElementById('login-success-alert');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password-btn');

    togglePasswordBtn.onclick = () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        togglePasswordBtn.textContent = 'Hide';
      } else {
        passwordInput.type = 'password';
        togglePasswordBtn.textContent = 'Show';
      }
    };

    form.onsubmit = async (e) => {
      e.preventDefault();

      // Reset errors
      errorAlert.style.display = 'none';
      successAlert.style.display = 'none';
      document.getElementById('identifier-error').textContent = '';
      document.getElementById('password-error').textContent = '';

      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;

      let hasClientError = false;
      if (!identifier) {
        document.getElementById('identifier-error').textContent = 'Please enter your username or email.';
        hasClientError = true;
      }
      if (!password) {
        document.getElementById('password-error').textContent = 'Please enter your password.';
        hasClientError = true;
      }

      if (hasClientError) return;

      // Loading state
      submitBtn.disabled = true;
      btnText.textContent = 'Signing in...';
      btnSpinner.style.display = 'inline-block';

      try {
        const user = await authService.login(identifier, password);
        successAlert.textContent = `Welcome back, ${user.display_name}! Redirecting...`;
        successAlert.style.display = 'block';

        showToast('Authentication successful.', 'success');

        setTimeout(() => {
          if (user.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }, 800);
      } catch (err) {
        submitBtn.disabled = false;
        btnText.textContent = 'Sign In';
        btnSpinner.style.display = 'none';

        if (err.fields) {
          if (err.fields.identifier) document.getElementById('identifier-error').textContent = err.fields.identifier;
          if (err.fields.password) document.getElementById('password-error').textContent = err.fields.password;
        }

        errorAlert.textContent = err.message || 'Invalid username or password.';
        errorAlert.style.display = 'block';
      }
    };
  </script>
</body>
</html>
